name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://setu-backend.kintree.space' }}
      EXPO_PUBLIC_TEAM_TOKEN: ${{ secrets.EXPO_PUBLIC_TEAM_TOKEN || 'setu-dev-token' }}
      EXPO_PUBLIC_FAMILY_ID: ${{ secrets.EXPO_PUBLIC_FAMILY_ID || 'fam_pune_9823' }}
      EXPO_PUBLIC_DEVICE_ID: ${{ secrets.EXPO_PUBLIC_DEVICE_ID || 'elder_pixel_6a_01' }}
      EXPO_PUBLIC_FALLBACK_URL: ${{ secrets.EXPO_PUBLIC_FALLBACK_URL || 'https://remix-boston-took-considering.trycloudflare.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Configure Build Environment
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL || 'https://setu-backend.kintree.space' }}
          EXPO_PUBLIC_TEAM_TOKEN=${{ secrets.EXPO_PUBLIC_TEAM_TOKEN || 'setu-dev-token' }}
          EXPO_PUBLIC_FAMILY_ID=${{ secrets.EXPO_PUBLIC_FAMILY_ID || 'fam_pune_9823' }}
          EXPO_PUBLIC_DEVICE_ID=${{ secrets.EXPO_PUBLIC_DEVICE_ID || 'elder_pixel_6a_01' }}
          EXPO_PUBLIC_FALLBACK_URL=${{ secrets.EXPO_PUBLIC_FALLBACK_URL || 'https://remix-boston-took-considering.trycloudflare.com' }}
          EOF
          echo "--- Build Environment Configured ---"
          grep "EXPO_PUBLIC_API_URL" .env

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package Release APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/setu-guardian-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
